name: MaxBot Validation

on:
  push:
    branches:
      - codex/catalog-web-local
      - main
  pull_request:
    branches:
      - codex/catalog-web-local
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused safe smokes
        shell: pwsh
        run: |
          python tests\catalog_core_smoke.py
          python tests\public_catalog_smoke.py
          python tests\booking_flow_smoke.py

      - name: Run project validation
        shell: pwsh
        run: .\scripts\validate.ps1 -IncludeSmoke
