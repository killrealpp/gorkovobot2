# Единый админский профиль бота. /app/data/admin_profile.py
# Меняйте этот файл, когда нужно сменить тематику: например, с базы отдыха на массажный салон. /app/data/admin_profile.py
# Секреты сюда не вносить: токены, API-ключи, payment secret и partner/user tokens остаются в .env. /app/core/config.py

business:
  # Секция business собирается в business.identity и knowledge.context. /app/data/admin_profile.py, /app/ai/admin_prompt.md, /app/ai/router_prompt.md, /app/ai/parser.py
  # Показывается в промптах, стартовом сообщении и базе знаний. /app/data/admin_profile.py, /app/ai/parser.py
  name: "Причал"
  # Тип бизнеса нужен AI, чтобы говорить правильными словами: база отдыха, салон, клиника, школа. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  type: "база отдыха"
  # Город/населённый пункт для клиентских ответов. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  city: "Выкса"
  # Адрес и ориентир для FAQ и справочного контекста. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  address: "конец улицы Максима Горького, пляж Максима Горького"
  # Короткое публичное описание, попадает в prompt context. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  description: "Бронирование беседок, бани с бассейном, гостевого дома и тёплой беседки."
  # Телефон администратора для ситуаций, когда расписание не открыто или нужна ручная помощь. /app/data/admin_profile.py, /app/ai/parser.py
  contact_phone: "89991369991"
  # Правило, если клиент спрашивает похожее место/другой парк/другой бизнес. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  service_area_rule: "Если спрашивают про Русалочку или другой парк, отвечай, что бронирование ведётся только на парк Максима Горького."

assistant:
  # Секция assistant собирается в assistant.persona. /app/data/admin_profile.py, /app/ai/admin_prompt.md, /app/ai/router_prompt.md, /app/ai/parser.py
  # Имя администратора, которое используется в промптах. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  name: "Любовь"
  # Роль для persona-промпта. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  role: "администратор"
  # Грамматический стиль. Для другого бота можно поставить neutral или male и поправить фразы. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  gender: "female"
  # Общий тон ответов. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  tone: "на Вы, деловой, тёплый, живой, без канцелярита"
  # Глаголы, которыми AI подтверждает действия. Они попадут в prompt. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  action_phrases:
    - "поняла"
    - "записала"
    - "проверила"
    - "подготовила"


booking:
  # Секция booking задаёт старт, порядок и вопросы сбора заявки. /app/data/admin_profile.py, /app/ai/parser.py, /app/dialog/dialog_guard.py
  # Как называть заявку клиенту. Для салона можно заменить на "запись". /app/data/admin_profile.py, /app/ai/admin_prompt.md
  entity_name: "бронь"
  # Что бот делает в целом: забронировать, записать, оформить заявку. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  action_verb: "забронировать"
  # Стартовое сообщение MAX/Telegram. Можно менять целиком. /app/data/admin_profile.py, /app/bot/max.py, /app/bot/telegram.py, /app/ai/parser.py
  start_reply: "Здравствуйте! Это бот для бронирования на базе отдыха «Причал» в Выксе. Что хотите забронировать: беседку, баню, дом или тёплую беседку?"
  # Порядок сбора данных. Код v1 использует это для prompt context; часть старого engine ещё хранит свои guards. /app/data/admin_profile.py, /app/ai/parser.py, /app/ai/admin_prompt.md
  required_order:
    - "service_type"
    - "date"
    - "service_variant"
    - "time"
    - "duration"
    - "guests_count"
    - "upsell_items"
    - "client_name"
    - "phone"
    - "confirmation"
  # Человеческие вопросы для каждого шага. Используются быстрыми fallback-вопросами. /app/data/admin_profile.py, /app/dialog/dialog_guard.py, /app/ai/admin_prompt.md
  questions:
    service_type: "что хотите забронировать — беседку, баню, дом или тёплую беседку?"
    date: "на какую дату планируете?"
    service_variant: "какую беседку выбираем?"
    time: "во сколько планируете приехать?"
    duration: "на сколько часов бронируем?"
    guests_count: "сколько вас будет человек?"
    upsell_items: "нужны ли допы — уголь, розжиг, лёд, посуда или кальян?"
    client_name: "как вас записать?"
    phone: "оставьте номер телефона для брони."
    confirmation: "проверьте заявку и подтвердите, если всё верно."
    fallback: "чем могу помочь?"
  # Поля, которые AI не должен собирать как часть заявки. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  ignored_fields:
    - "event_format"
  # Нужно ли предлагать дополнительные услуги в сценарии; если false или addons пустой, шаг допов пропускается. /app/data/admin_profile.py, /app/dialog/state.py, /app/dialog/engine.py, /app/ai/parser.py
  upsell_enabled: true
  # Сколько раз максимум мягко предлагать допы до перехода к контактам. /app/data/admin_profile.py, /app/dialog/engine.py, /app/ai/parser.py
  max_upsell_offers: 2

payment:
  # Секция payment попадает в prompt policy и расчёт предоплаты. /app/data/admin_profile.py, /app/ai/admin_prompt.md, /app/dialog/payment.py
  # Включена ли предоплата в бизнес-сценарии. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  enabled: true
  # Доля предоплаты. Backend считает фактическую сумму и клиентский текст ссылки по этому проценту. /app/dialog/payment.py, /app/dialog/engine.py, /app/dialog/post_payment_message.py, /app/data/admin_profile.py
  prepayment_percent: 50
  # Формулировка про срок жизни ссылки. /app/data/admin_profile.py, /app/ai/admin_prompt.md, /app/ai/parser.py
  link_lifetime_text: "Ссылка на оплату действует ограниченное время, обычно около часа."
  # Правило подтверждения для AI. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  confirmation_rule: "Бронь считается подтверждённой только после успешной оплаты."
  # Что говорить, если клиент планирует оплатить позже. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  later_payment_text: "Когда будете готовы оплатить, напишите мне — я отправлю новую актуальную ссылку."

cancellation:
  # Секция cancellation сейчас в основном идёт в prompt policy; часть guards ещё в engine. /app/data/admin_profile.py, /app/ai/admin_prompt.md, /app/dialog/engine.py
  # За сколько дней можно вернуть предоплату; сейчас справочная настройка v2. /app/dialog/engine.py
  refund_days: 7
  # Клиентская политика отмены. /app/data/admin_profile.py, /app/ai/admin_prompt.md, /app/ai/parser.py
  policy_text: "При отмене за 7 дней или раньше предоплата возвращается. Если до даты бронирования меньше 7 дней, предоплата не возвращается; лучше предложить перенос."
  # Отмена и перенос всегда через подтверждение клиента; сейчас справочная настройка v2. /app/dialog/engine.py
  require_confirmation: true

post_payment:
  # Секция post_payment формирует сообщения после оплаты. /app/dialog/post_payment_message.py, /app/dialog/payment_status.py
  # Тексты после успешной оплаты. Это не секреты, а клиентская памятка. /app/dialog/post_payment_message.py
  paid_received_text: "Оплату получила ✅"
  # Подтверждение после оплаты. Если меняете сферу бизнеса, замените слово «бронь» на «запись». /app/dialog/post_payment_message.py
  confirmed_text: "Бронь подтверждена. Ждём вас!"
  # Ключ инструкции по умолчанию, если у услуги нет своего ключа. /app/dialog/post_payment_message.py
  default_instruction_key: "default"
  # Общие памятки после оплаты. Идут после видеоинструкции, если include_common_info=true. /app/dialog/post_payment_message.py
  common_info:
    - "Мы хотим, чтобы ваш визит прошёл максимально комфортно, поэтому хотели бы поделиться общей информацией перед вашим приходом: рекомендуем с собой взять одноразовую посуду, приборы, скатерть."
    - "А также проинформируем вас: если вы забронировали баню с бассейном, то с вениками нельзя."
    - "На нашей территории допускается использование только угля в мангале. Использование дров запрещено."
    - "И обращаем ваше внимание: музыку на нашей базе можно включать громко до 23:00."
  # Видео и памятки по типам объектов. Ключ выбирается из service.post_payment_instruction_key или variant.post_payment_instruction_key. /app/dialog/post_payment_message.py
  instructions:
    default:
      header: ""
      video_url: ""
      include_common_info: true
    bathhouse:
      header: "Видеоинструкция по приезде в баню с бассейном:"
      video_url: "https://disk.yandex.ru/d/vc7ki6Pm3LPYQA"
      include_common_info: true
    closed_gazebo:
      header: "Видеоинструкция по приезде в закрытую беседку:"
      video_url: "https://disk.yandex.ru/d/ShvGhGJnC1Z3AQ"
      include_common_info: true
    house:
      header: "Видеоинструкция по приезде в гостевой дом:"
      video_url: "https://disk.yandex.ru/d/h1TZWkUYHoCUoA"
      include_common_info: true
    gazebo:
      header: ""
      video_url: ""
      include_common_info: true

