knowledge:
  # Секция knowledge собирается в build_profile_knowledge(). /app/data/admin_profile.py, /app/ai/parser.py, /app/ai/admin_prompt.md
  # Общие факты попадают в LLM context вместо отдельного knowledge.md. /app/data/admin_profile.py, /app/ai/parser.py
  summary: |
    База отдыха «Причал» находится в Выксе, на пляже Максима Горького.
    Для бронирования нужна предоплата 50% от итоговой стоимости.
    После оплаты объект закрепляется за клиентом на выбранную дату.
    Оставшуюся сумму можно оплатить по факту приезда администратору.
  source_files:
    - "business_profile/knowledge.md"
  facts:
    - "Крытая беседка находится на Белом песке / Беленьком песочке."
    - "Баня с бассейном — до 15 человек."
    - "Тёплая беседка — до 30 человек."
    - "Дом — до 20 человек для праздника или мероприятия."
    - "Ночевать в доме могут до 5 человек."
    - "Беседка обычно бронируется на сутки — освободить нужно до 08:00 следующего дня."
    - "В мангале можно использовать только угли; дрова, доски и мусор жечь нельзя."
  faq:
    - question: "До скольки можно быть?"
      answer: "Беседка бронируется на сутки — до 08:00 утра следующего дня."
    - question: "Что брать с собой?"
      answer: "Скатерть, посуду, стаканы, салфетки, питьевую воду, продукты, уголь и розжиг. Мангал входит в стоимость беседки."
    - question: "Мангал входит?"
      answer: "Да, мангал входит в стоимость беседки. Мангальные принадлежности оплачиваются отдельно, если клиенту нужны решётки, шампуры, кочерга или опахало."
    - question: "Можно ли фейерверк?"
      answer: "Мы рекомендуем отказаться от фейерверков ради безопасности. Если всё же планируете запуск, согласуйте место с администратором."

prompt_rules:
  # Секция prompt_rules собирается в prompt.extra_rules. /app/data/admin_profile.py, /app/ai/admin_prompt.md, /app/ai/router_prompt.md
  # Эти правила добавляются в системные промпты как переменная. /app/data/admin_profile.py, /app/ai/admin_prompt.md
  universal:
    - "Не показывай клиенту технические слова: JSON, API, backend, YCLIENTS, slot, payment_id, record_id."
    - "Не выдумывай цены, доступность, скидки, платежи, записи и внутренние id."
    - "Рекомендация объекта не равна выбору клиента: записывай service_type/service_variant только после явного выбора."
    - "Если клиент задаёт вопрос и одновременно даёт данные, сначала ответь на вопрос, потом продолжи сбор заявки."
    - "Отмена и перенос выполняются только после явного подтверждения клиента."
  project_specific:
    - "Формат отдыха не входит в заявку и не должен отдельно собираться."
    - "Если расписания на дальнюю дату нет, дай телефон администратора и предложи уточнить позже."
